<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Inkling">
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8378" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#3f8378" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3f8378" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8378" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#3f8378" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3f8378" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8378" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#3f8378" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3f8378" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- three written lines, each thinning out as it goes -->
    <path d="M14 30 C 26 24, 34 36, 46 30 C 56 25, 66 33, 82 28"
          stroke="url(#l1)" stroke-width="5.4"/>
    <path d="M14 50 C 28 44, 38 56, 52 49 C 62 44, 70 51, 82 47"
          stroke="url(#l2)" stroke-width="5"/>
    <path d="M14 70 C 26 65, 36 75, 50 69 C 58 65, 66 70, 78 67"
          stroke="url(#l3)" stroke-width="4.6"/>
  </g>

  <!-- the nib, still on the paper -->
  <circle cx="14" cy="30" r="3.4" fill="#3f8378"/>
</svg>
