<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A favicon is read at 16px, so the mark is reduced to what survives there:
       paper, two strokes thinning out, and a nib still resting on the first. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8378"/>
      <stop offset="0.66" stop-color="#3f8378" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3f8378" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8378" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#3f8378" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3f8378" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="#f7f3ea"/>

  <g fill="none" stroke-linecap="round">
    <path d="M7 12.5 C 12 9.6, 16 15.4, 21 12.2 C 23.4 10.7, 24.6 12.2, 26 11.4"
          stroke="url(#a)" stroke-width="3.2"/>
    <path d="M7 20.6 C 11.4 18.2, 15 22.6, 20 19.8 C 22 18.7, 23.4 19.8, 25 19.2"
          stroke="url(#b)" stroke-width="2.9"/>
  </g>

  <circle cx="7" cy="12.5" r="2.3" fill="#3f8378"/>
</svg>
